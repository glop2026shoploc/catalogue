# Base de données pour le DÉVELOPPEMENT LOCAL uniquement.
# L'application se lance depuis l'IDE (ou ./mvnw spring-boot:run).
services:
  catalogue-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: catalogue
      POSTGRES_USER: catalogue
      POSTGRES_PASSWORD: catalogue        # mot de passe de dev, sans importance
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - catalogue-dev-data:/var/lib/postgresql/data
  garage:
    image: dxflrs/garage:v2.4.1
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: GK0123456789abcdef0123456789abcdef   # GK + 32 hex
      GARAGE_DEFAULT_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef  # 64 hex
      GARAGE_DEFAULT_BUCKET: active
    ports:
      - "127.0.0.1:3900:3900"   # API S3
      - "127.0.0.1:3901:3901"   # RPC
      - "127.0.0.1:3903:3903"   # admin
    volumes:
      - ./garage/config/garage.toml:/etc/garage.toml
      - ./garage/meta:/var/lib/garage/meta
      - ./garage/data:/var/lib/garage/data
  garage-webui:
    image: khairul169/garage-webui:latest
    depends_on:
      - garage
    environment:
      API_BASE_URL: "http://garage:3903"
      S3_ENDPOINT_URL: "http://garage:3900"
      API_ADMIN_KEY: "dev-admin-token"
    volumes:
      - ./garage/config/garage.toml:/etc/garage.toml:ro
    ports:
      - "127.0.0.1:3909:3909"
  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: secure_password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_log:/var/log/rabbitmq
    restart: unless-stopped
volumes:
  catalogue-dev-data: {}
  rabbitmq_data:
  rabbitmq_log:
