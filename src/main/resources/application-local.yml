server:
    port: 8085  # 8080 est pris par la gateway
    servlet:
        context-path: /api/catalogue
spring:
    servlet:
        multipart:
            max-file-size: 200MB
            max-request-size: 200MB
    application:
        name: catalogue
    rabbitmq:
        host: ${RABBITMQ_HOST:localhost}
        port: ${RABBITMQ_PORT:5672}
        username: ${RABBITMQ_USER:admin}
        password: ${RABBITMQ_PASSWORD:secure_password}
    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5432/catalogue}
        username: ${DB_USER:admin}
        password: ${DB_PASSWORD:admin123}
        driver-class-name: org.postgresql.Driver
        hikari:
            maximum-pool-size: 10

    jpa:
        hibernate:
            ddl-auto: none
        show-sql: false
        properties:
            hibernate:
                format_sql: true
                open-in-view: false

    flyway:
        enabled: true
        locations: classpath:db/migration
        baseline-on-migrate: true
        baseline-version: 0
        validate-on-migrate: true
garage:
    endpoint: http://localhost:3900
    access-key: GK0123456789abcdef0123456789abcdef
    secret-key: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    region-name: garage
    bucket: active