server:
    port: 8085  # 8080 est pris par la gateway
    servlet:
        context-path: /api/catalogue
spring:
    servlet:
        multipart:
            max-file-size: 200MB
            max-request-size: 200MB
    application:
        name: catalogue
    datasource:
        url: ${DB_URL:}
        username: ${DB_USER:}
        password: ${DB_PASSWORD:}
        driver-class-name: org.postgresql.Driver
        hikari:
            maximum-pool-size: 10

    jpa:
        hibernate:
            ddl-auto: none
        show-sql: false
        properties:
            hibernate:
                format_sql: true
                open-in-view: false

    flyway:
        enabled: true
        locations: classpath:db/migration
        baseline-on-migrate: true
        baseline-version: 0
        validate-on-migrate: true

management:
    endpoints:
        web:
            exposure:
                include: health,prometheus

garage:
    endpoint: http://localhost:3900
    access-key: GK0123456789abcdef0123456789abcdef
    secret-key: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    region-name: garage
    bucket: active